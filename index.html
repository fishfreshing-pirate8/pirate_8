<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海賊訂位小幫手</title>
    <style>
        /* 基礎樣式與海賊風格定義 */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif; }
        
        /* 🌅 👑 終極修正點：100% 精準嵌入高解析陽光沙灘 CDN 實體雲端圖片網址，桌面雙擊 100% 通行 */
        /* 🟢 完美的第 15 行完整長相，絕對不能漏掉 photo- 開頭的圖片編號與引數： */
body { 
    background: linear-gradient(rgba(5, 19, 41, 0.45), rgba(5, 19, 41, 0.8)), url("a.jpg") no-repeat center center fixed; 
    background-size: cover;
            color: #e0e6ed; 
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }
        
        header { background: rgba(5, 19, 41, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: white; padding: 18px 24px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffb703; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .logo { font-size: 26px; font-weight: 900; color: #ffb703; text-shadow: 0 0 10px rgba(255,183,3,0.5); letter-spacing: 1px; }
        .nav-links a { color: #b8c7d9; text-decoration: none; margin-left: 25px; font-size: 16px; font-weight: bold; transition: all 0.3s; }
        .nav-links a:hover { color: #ffb703; text-shadow: 0 0 8px rgba(255,183,3,0.5); }
        
        .hero { background: linear-gradient(rgba(5, 19, 41, 0.1), rgba(5, 19, 41, 0.6)), url('https://unsplash.com') no-repeat center center/cover; height: 420px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px; }
        .hero h1 { font-size: 52px; font-weight: 900; margin-bottom: 20px; text-shadow: 0 4px 15px rgba(0,0,0,0.8); letter-spacing: 3px; color: #ffffff; }
        .hero p { font-size: 24px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); background: linear-gradient(90deg, #ffb703, #fb8500); color: #051329; padding: 10px 30px; border-radius: 50px; font-weight: 900; box-shadow: 0 4px 15px rgba(251,133,0,0.4); }
        
        .section { max-width: 1000px; margin: 40px auto; padding: 40px; background: rgba(17, 37, 66, 0.7); border-radius: 20px; border: 1px solid rgba(255, 183, 3, 0.2); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); position: relative; z-index: 2; }
        .section-title { font-size: 32px; color: #ffb703; margin-bottom: 30px; position: relative; padding-bottom: 15px; font-weight: 900; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .section-title::after { content: ''; position: absolute; left: 0; bottom: 0; width: 100px; height: 5px; background: linear-gradient(90deg, #ffb703, #fb8500); border-radius: 3px; box-shadow: 0 0 8px #fb8500; }
        
        .schedule-box { background: rgba(255, 248, 220, 0.02); border: 2px dashed #ffb703; border-radius: 16px; padding: 25px; box-shadow: inset 0 0 20px rgba(255,183,3,0.05); }
        .schedule-header { font-size: 22px; color: #ffb703; font-weight: 900; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .table-container { width: 100%; overflow-x: auto; border-radius: 12px; border: 1px solid rgba(255, 183, 3, 0.2); }
        .schedule-table { width: 100%; border-collapse: collapse; background: #0d1f38; min-width: 650px; }
        .schedule-table th, .schedule-table td { padding: 16px 18px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .schedule-table th { background: linear-gradient(180deg, #fb8500, #d47a00); color: white; font-weight: 900; font-size: 16px; letter-spacing: 1px; }
        .schedule-table tr:hover td { background-color: rgba(255, 183, 3, 0.04); }
        .highlight-td { background-color: rgba(255, 183, 3, 0.02); }
        
        .status-badge { padding: 6px 14px; border-radius: 50px; font-size: 13px; font-weight: 900; letter-spacing: 1px; }
        .status-open { background-color: rgba(46, 125, 50, 0.2); color: #81c784; border: 1px solid #4caf50; }
        .status-full { background-color: rgba(198, 40, 40, 0.2); color: #e57373; border: 1px solid #f44336; }
        .btn-book-now { background: linear-gradient(135deg, #00b4d8, #0077b6); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 900; font-size: 14px; box-shadow: 0 4px 10px rgba(0,180,216,0.3); transition: all 0.2s; }
        .btn-book-now:hover { background: linear-gradient(135deg, #00f5d4, #00b4d8); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,245,212,0.4); }
        .btn-book-now:disabled { background: #22354f; color: #5f758e; box-shadow: none; cursor: not-allowed; border: 1px solid #364b66; }
        
        #booking.section { background: linear-gradient(180deg, #0d1f38 0%, #061326 100%); }
        .selected-info-banner { background: rgba(0, 180, 216, 0.08); border-left: 6px solid #00b4d8; padding: 20px; border-radius: 12px; font-size: 18px; line-height: 1.8; color: #e0f2fe; margin-bottom: 25px; }
        .booking-form { display: flex; flex-direction: column; gap: 24px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 10px; }
        .form-group label { font-weight: 900; color: #ffb703; font-size: 15px; }
        .form-group input { padding: 14px; border: 2px solid #223f66; border-radius: 10px; font-size: 16px; background-color: #051329; color: white; transition: all 0.3s; }
        .form-group input:focus { outline: none; border-color: #00b4d8; box-shadow: 0 0 10px rgba(0,180,216,0.3); }
        .submit-btn { background: linear-gradient(90deg, #ffb703, #fb8500); color: #051329; padding: 16px; border: none; border-radius: 10px; font-size: 22px; font-weight: 900; cursor: pointer; margin-top: 15px; box-shadow: 0 6px 20px rgba(251,133,0,0.3); transition: all 0.3s; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(251,133,0,0.5); background: linear-gradient(90deg, #ffc947, #ff9f1c); }
        .submit-btn:disabled { background: #22354f !important; color: #5f758e !important; box-shadow: none !important; cursor: not-allowed !important; }
        
        footer { background-color: #040d1a; color: #5f758e; text-align: center; padding: 35px 20px; margin-top: 80px; position: relative; z-index: 2; }
        .float-buttons { position: fixed; bottom: 35px; right: 35px; display: flex; flex-direction: column; gap: 15px; z-index: 999; }
        .btn-float { width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; text-decoration: none; font-weight: 900; font-size: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: all 0.3s; }
        .btn-float:hover { transform: scale(1.15); }
        .btn-line { background-color: #06C755; }
        .btn-phone { background-color: #ffb703; color: #051329; }
        @media (max-width: 768px) { header { flex-direction: column; gap: 15px; padding: 15px; } .nav-links a { margin: 0 10px; font-size: 15px; } .hero h1 { font-size: 36px; } .hero p { font-size: 18px; } .section { margin: 25px 12px; padding: 25px 15px; } .form-row { grid-template-columns: 1fr; gap: 20px; } .schedule-table th, .schedule-table td { padding: 12px 10px; font-size: 14px; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">🏴‍☠️ 海賊訂位小幫手</div>
        <nav class="nav-links">
            <a href="#schedule-section">最新船期</a>
            <a href="#booking">線上預約</a>
        </nav>
    </header>

    <div class="hero">
        <h1>奔向大海！與海賊八號開啟探險</h1>
        <p>⚓ 專業海釣・隨船觀光・團體包船首選</p>
    </div>

    <!-- 📅 日程表格（黃金 RWD 前置順序版） -->
    <div id="schedule-section" class="section">
        <div class="schedule-box">
            <div class="schedule-header">👑 近期推薦出船日程表（資料即時連動雲端）</div>
            <div class="table-container">
                <div id="loading" class="loading-text" style="text-align: center; padding: 30px; font-weight: bold; color: #ffb703;">正在從海賊大腦同步最新船期...</div>
                <table class="schedule-table" id="schedule-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>出船日期</th>
                            <th>剩餘位數</th>
                            <th>線上預約</th>
                            <th>行程班別</th>
                            <th>滿班人數</th>
                            <th>目前狀態</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ✍️ 預約表單面板 -->
    <div id="booking" class="section">
        <h2 class="section-title">立即預約下一趟探險</h2>
        <div class="selected-info-banner">
            📌 您目前選取的船期資訊：<br>
            📅 出海日期：<span id="display-date" style="color: #ffb703; font-size: 20px; font-weight: 900;">-- 請先點選上方日程表的「點我報名」 --</span><br>
            🚢 出海行程：<span id="display-trip" style="color: #ffb703; font-size: 20px; font-weight: 900;">-- 請先點選上方日程表的「點我報名」 --</span>
        </div>
        <form class="booking-form" id="reg-form" onsubmit="handleFormSubmit(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">聯絡人姓名 *</label>
                    <input type="text" id="name" required placeholder="請輸入聯絡人真實姓名">
                </div>
                <div class="form-group">
                    <label for="phone">聯絡電話 *</label>
                    <input type="tel" id="phone" required placeholder="請輸入聯絡人手機號碼">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="attendees">預約人數 *</label>
                    <input type="number" id="attendees" required min="1" max="20" placeholder="請輸入人數 (1-20人)">
                </div>
                <div class="form-group" style="display: none;">
                    <input type="text" id="hidden-date">
                    <input type="text" id="hidden-trip">
                </div>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn" disabled style="background: #22354f; color: #5f758e; cursor: not-allowed;">請先選取上方出船日期</button>
        </form>
    </div>

    <footer>
        <p>© 2026 海賊八號 觀光娛樂船 版權所有</p>
        <p>⚓ 登船地點：新北市萬里區萬里漁港碼頭 📞 聯絡電話：0908198453</p>
    </footer>

    <div class="float-buttons">
        <a href="https://line.me/ti/p/FeqxicFYDk" target="_blank" class="btn-float btn-line">LINE</a>
        <a href="tel:0908198453" class="btn-float btn-phone">電話</a>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyjgQIhzVXLc69kT1iTZrEjJ3LMPTnnf0f6xo62nLHESoxTJBPnkLgHSOlTxLjLfmF39g/exec";

        window.addEventListener('DOMContentLoaded', () => {
            fetchSchedule();
        });

        function fetchSchedule() {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('schedule-body');
                    tbody.innerHTML = '';
                    data.forEach(item => {
                        const isFull = item.status === '已額滿' || item.available === 0;
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="highlight-td"><b style="color: #ffffff;">${item.date}</b></td>
                            <td class="highlight-td"><span style="color: ${item.available <= 3 ? '#ef4444' : '#4ade80'}; font-weight: 900; font-size: 16px;">${item.available} 位</span></td>
                            <td class="highlight-td"><button class="btn-book-now" ${isFull ? 'disabled' : ''} onclick="selectSchedule('${item.date}', '${item.trip}')">${isFull ? '客滿' : '點我報名'}</button></td>
                            <td style="color: #cbd5e1; font-weight: bold; text-align: left;">${item.emoji} ${item.trip}</td>
                            <td style="color: #758a9f;">${item.maxSeats} 人</td>
                            <td><span class="status-badge ${isFull ? 'status-full' : 'status-open'}">${item.status}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('schedule-table').style.display = 'table';
                }).catch(err => {
                    document.getElementById('loading').innerText = '暫時無法同步雲端課表，請聯絡客服。';
                    document.getElementById('loading').style.color = '#ef4444';
                });
        }

        function selectSchedule(dateString, tripValue) {
            document.getElementById('display-date').innerText = dateString;
            document.getElementById('display-trip').innerText = tripValue;
            document.getElementById('hidden-date').value = dateString;
            document.getElementById('hidden-trip').value = tripValue;
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = false;
            submitBtn.style.background = "linear-gradient(90deg, #ffb703, #fb8500)";
            submitBtn.style.color = "#051329";
            submitBtn.style.cursor = "pointer";
            submitBtn.innerText = "🌊 確認送出・即刻出海！";

            document.getElementById('booking').scrollIntoView({ behavior: 'smooth' });
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = '🛡️ 正在核對雲端艙位安全...';
            btn.disabled = true;

            const payload = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                date: document.getElementById('hidden-date').value, 
                attendees: document.getElementById('attendees').value,
                trip: document.getElementById('hidden-trip').value 
            };

            fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(result => {
                if (result.status === 'overbooked') {
                    alert(`❌ 預約失敗（人數超額）\n\n抱歉！您選擇的日期目前僅剩【 ${result.available} 個空位 】。\n但您填寫了【 ${payload.attendees} 人 】，已超出上限。\n\n系統將自動重新整理網頁，請重新選擇人數！`);
                    window.location.reload();
                } 
                else if (result.status === 'success') {
                    alert(`🏴‍☠️ 揚帆出發！預約成功！\n\n感謝 ${payload.name} 的報名！\n海賊小幫手已將您的資料安全存入雲端艙防。\n\n網頁即將重新整理以更新最新賸餘座位！`);
                    window.location.reload();
                } else {
                    alert('系統連線有誤，頁面將自動重整，請再試一次。');
                    window.location.reload();
                }
            })
            .catch(err => {
                alert('發送失敗，請確認網路連線或後台設定。');
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
